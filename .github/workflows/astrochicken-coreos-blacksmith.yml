name: Astrochicken CoreOS base qualification
on:
  push:
    branches: [codex/coreos-fatline-qemu]
    paths:
      - .github/workflows/astrochicken-coreos-blacksmith.yml
      - .github/dispatch/astrochicken-coreos.request.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-alpine-astrochicken-coreos
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pseudo-dispatch and pinned CoreOS source
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.schema == 1 and .execute == true and .gate == "astrochicken-coreos" and .runner == "blacksmith-2vcpu-ubuntu-2404" and .nix_alpine_ref == "github.sha"' \
            .github/dispatch/astrochicken-coreos.request.json >/dev/null
          source local/fatline-qualification.sources
          [[ "$COMPOSITION_AGNI_REV" =~ ^[0-9a-f]{40}$ ]]
          echo "Nix-Alpine SHA: $GITHUB_SHA"
          echo "Agni CoreOS SHA: $COMPOSITION_AGNI_REV"
      - name: Prepare systemd user manager and rootless Podman
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(ps -p 1 -o comm=)" = systemd
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman uidmap dbus-user-session
          fi
          if [[ -z "${XDG_RUNTIME_DIR:-}" || ! -S "${XDG_RUNTIME_DIR:-/nonexistent}/bus" ]]; then
            sudo loginctl enable-linger "$(id -un)"
            sudo systemctl start "user@$(id -u).service"
          fi
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for i in $(seq 1 60); do test -S "$XDG_RUNTIME_DIR/bus" && break; sleep 1; done
          test -S "$XDG_RUNTIME_DIR/bus"
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "PASS: Blacksmith user systemd manager and rootless Podman ready"
      - name: Prepare isolated Nix-Alpine workspace and toolbox
        shell: bash
        env:
          WORKSPACES: ${{ runner.temp }}/astrochicken-workspaces
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORKSPACES"
          cp -a "$GITHUB_WORKSPACE" "$WORKSPACES/nix-alpine"
          git -C "$WORKSPACES/nix-alpine" status --porcelain | grep -q . && {
            echo "Nix-Alpine checkout is not clean" >&2
            exit 1
          }
          make -C "$WORKSPACES/nix-alpine/local" bootstrap \
            SCOPE=blacksmith-astrochicken WORKSPACES="$WORKSPACES"
      - name: Qualify persistent Astrochicken service in CoreOS QEMU
        shell: bash
        env:
          WORKSPACES: ${{ runner.temp }}/astrochicken-workspaces
          LOG_DIR: ${{ runner.temp }}/astrochicken-logs
        run: |
          set -Eeuo pipefail
          make -C "$WORKSPACES/nix-alpine/local" qualify-coreos-astrochicken \
            SCOPE=blacksmith-astrochicken \
            WORKSPACES="$WORKSPACES" \
            COREOS_QEMU_ACCEL=tcg \
            COREOS_QEMU_CPUS=2 \
            COREOS_QEMU_RAM_MB=3072 \
            COREOS_QEMU_TIMEOUT=5400 \
            LOG=1 LOG_DIR="$LOG_DIR"
      - name: Upload Astrochicken qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrochicken-coreos-${{ github.run_id }}
          path: ${{ runner.temp }}/astrochicken-logs/
          if-no-files-found: warn
          retention-days: 7
