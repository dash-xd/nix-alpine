name: Release contract tests

on:
  push:
    paths:
      - 'local/Makefile'
      - 'local/*.py'
      - 'local/release-*.sh'
      - 'local/test-release.sh'
      - 'release/**'
      - '.github/workflows/release-contract.yml'
  pull_request:
    paths:
      - 'local/Makefile'
      - 'local/*.py'
      - 'local/release-*.sh'
      - 'release/**'
      - '.github/workflows/release-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(find local -type f -name '*.py' -print0)
      - name: Release shell syntax
        run: bash -n local/release-import.sh local/release-ledger.sh local/release-qualify.sh local/test-release.sh release/release-metadata.sh
      - name: Release ledger negative and positive contracts
        run: make -C local test-release
      - name: Make target smoke
        run: |
          make -C local version COMPONENT=generic-contract RELEASE_STATE="$RUNNER_TEMP/releases"
