name: Fatline OCI archive cache qualification
on:
  push:
    branches: [codex/fatline-composition-qualification]
    paths:
      - .github/workflows/fatline-oci-cache.yml
      - .github/dispatch/fatline-oci-cache.request.json
      - local/ci-image-archives.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fatline-oci-cache
  cancel-in-progress: false
jobs:
  archive-parity:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      ARCHIVES: ${{ runner.temp }}/fatline-image-archives
      REDIS_IMAGE: localhost/nix-alpine/redis:qualified-2026.10.23
      NGINX_IMAGE: localhost/nix-alpine/nginx:qualified-2026.10.23.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact pseudo-dispatch request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.schema == 1 and .execute == true and .gate == "oci-archive" and (.agni_sha | test("^[a-f0-9]{40}$"))' .github/dispatch/fatline-oci-cache.request.json >/dev/null
          echo "agni_sha=$(jq -r .agni_sha .github/dispatch/fatline-oci-cache.request.json)" >> "$GITHUB_OUTPUT"
      - name: Install Podman
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v podman; then sudo apt-get update && sudo apt-get install -y podman uidmap; fi
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
      - name: Restore compressed OCI image archives
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ARCHIVES }}
          key: fatline-oci-v1-x86_64-${{ hashFiles('release/components/redis/flake.nix', 'release/components/redis/flake.lock', '.github/dispatch/fatline-oci-cache.request.json', 'local/ci-image-archives.sh') }}
      - name: Install Nix only on archive cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v31
      - name: Build exact-source infrastructure image archives
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          AGNI_SHA: ${{ steps.request.outputs.agni_sha }}
        run: |
          set -Eeuo pipefail
          git init "$RUNNER_TEMP/agni"
          git -C "$RUNNER_TEMP/agni" remote add origin https://github.com/dash-xd/agni.git
          git -C "$RUNNER_TEMP/agni" fetch --depth=1 origin "$AGNI_SHA"
          git -C "$RUNNER_TEMP/agni" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/agni" rev-parse HEAD)" = "$AGNI_SHA"
          nix build --no-link --print-out-paths ./release/components/redis#image > "$RUNNER_TEMP/redis-out"
          nix build --no-link --print-out-paths "$RUNNER_TEMP/agni/local/fatline#nginx-image" > "$RUNNER_TEMP/nginx-out"
          podman load -i "$(cat "$RUNNER_TEMP/redis-out")"
          podman load -i "$(cat "$RUNNER_TEMP/nginx-out")"
          redis_id=$(podman images --format '{{.ID}}' localhost/fatline-redis:candidate | head -1)
          nginx_id=$(podman images --format '{{.ID}}' localhost/fatline-nginx:candidate | head -1)
          test -n "$redis_id" && test -n "$nginx_id"
          podman tag "$redis_id" "$REDIS_IMAGE"
          podman tag "$nginx_id" "$NGINX_IMAGE"
          bash local/ci-image-archives.sh export "$ARCHIVES" "$REDIS_IMAGE" "$NGINX_IMAGE"
      - name: Verify archive checksums and image identities on fresh Podman storage
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$ARCHIVES/manifest.tsv"
          podman image rm -f "$REDIS_IMAGE" "$NGINX_IMAGE" || true
          bash local/ci-image-archives.sh import "$ARCHIVES" "$REDIS_IMAGE" "$NGINX_IMAGE"
          podman image exists "$REDIS_IMAGE"
          podman image exists "$NGINX_IMAGE"
          {
            echo '## OCI archive qualification'
            echo "- Nix build needed: ${{ steps.cache.outputs.cache-hit != 'true' }}"
            echo '- Compressed archive SHA-256: verified'
            echo '- Loaded Podman image identities: verified'
            echo '- Persistent Nix store cache: not used'
            echo '- Runtime services: not activated'
          } >> "$GITHUB_STEP_SUMMARY"
